services:
  lotus-credit:
    build: .
    container_name: lotus-credit
    restart: unless-stopped
    ports:
      - "16346:3001"
    environment:
      - PORT=3001
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-lotus-admin-2026}
      - JWT_SECRET=${JWT_SECRET:-change-this-secret-in-production}
    volumes:
      - ./data:/app/data
